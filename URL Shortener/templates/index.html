<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-300 text-white font-sans p-6">
    <div class="max-w-2xl mx-auto">

        <h1 class="text-3xl font-bold mb-6 text-center text-white">
            Hello! URL Shortener
        </h1>

        <form method="POST" class="bg-white shadow-md rounded p-6 mb-6 space-y-4">
            <label class="block text-black">
                <span class="text-blue-700">Enter a long URL</span>
                <input 
                    type="text" 
                    name="url" 
                    placeholder="https://www.example.com/VeryLongURL" 
                    required 
                    class="mt-1 block w-full border border-gray-400 rounded p-2"
                >
            </label>

            <button 
                class="bg-blue-900 text-white px-4 py-2 rounded hover:bg-blue-400" 
                type="submit">
                Shorten!
            </button>
        </form>

        <h2 class="text-xl font-bold mb-2 text-white">All Shortened URLs</h2>

        {% if all_urls %}
        <div class="overflow-x-auto">
            <table class="w-full border border-collapse border-gray-500 text-sm bg-white text-black">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="border px-4 py-2 text-left">Short URL</th>
                        <th class="border px-4 py-2 text-left">Original URL</th>
                        <th class="border px-4 py-2 text-left">Visits</th>
                        <th class="border px-4 py-2 text-left">Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for url in all_urls %}
                    <tr class="border">

                        <!-- Short URL -->
                        <td class="px-4 py-2 border">
                            <a href="/{{url[1]}}" target="_blank" class="text-blue-600 underline">
                                http://localhost:5500/{{ url[1] }}
                            </a>
                        </td>

                        <!-- Original URL -->
                        <td class="px-4 py-2 border">
                            {{ url[0] }}
                        </td>

                        <!-- Visits -->
                        <td class="px-4 py-2 border">
                            {{ url[2] }}
                        </td>

                        <!-- Delete Button -->
                        <td class="px-4 py-2 border">
                            <form action="/delete/{{url[1]}}" method="POST"
                                  onsubmit="return confirm('Delete this short URL?');">
                                <button 
                                    type="submit" 
                                    class="text-red-600 hover:text-red-800">
                                    DELETE
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p class="text-black">No URLs have been shortened yet.</p>
        {% endif %}

        <p class="text-white mt-4">We are working on it.</p>
    </div>
</body>
</html>
